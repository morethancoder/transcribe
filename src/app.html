<!doctype html>
<html lang="en" data-theme="light" data-accent="cobalt" data-radius="round" data-density="comfortable">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<script>
			// Resolve the theme before first paint, or the page flashes light and
			// then corrects itself once the app hydrates. Kept in sync with
			// $lib/settings — same key, same three values.
			try {
				var pref = localStorage.getItem('transcrape-theme') || 'system';
				var dark =
					pref === 'dark' ||
					(pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
				document.documentElement.dataset.theme = dark ? 'dark' : 'light';
			} catch (e) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="shell">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
